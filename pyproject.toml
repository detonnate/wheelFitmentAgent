[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wheel-fitment-agent"
version = "0.2.0"
description = "MCP server giving GitHub Copilot wheel fitment checks backed by the Wheel-Size API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wheel-fitment-mcp = "wheel_fitment.server:main"

[tool.hatch.build.targets.wheel]
packages = ["wheel_fitment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
