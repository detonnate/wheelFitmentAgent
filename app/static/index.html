<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel Fitment Agent</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1b1f23; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px #0002; }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 1.4rem; }
  h2 { margin-top: 0; font-size: 1.1rem; }
  #log { height: 380px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  .msg { margin: 6px 0; white-space: pre-wrap; }
  .user { color: #0b5cad; }
  .bot { color: #1b1f23; }
  form { display: grid; gap: 8px; }
  input, textarea, button { font: inherit; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  button { background: #0b5cad; color: #fff; border: 0; cursor: pointer; }
  button:disabled { opacity: .6; }
  #chatForm { grid-template-columns: 1fr auto; }
  #result img { max-width: 100%; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>Wheel Fitment Agent</h1>

  <section>
    <h2>Will it fit?</h2>
    <div id="log"><div class="msg bot">Tell me your car (make, model, year, region) and the wheels you want (diameter, width, offset, tyre size).</div></div>
    <form id="chatForm">
      <input id="msg" placeholder="e.g. 2019 Golf GTI UK, want 18x8 ET45 with 225/40R18" autocomplete="off" required>
      <button>Send</button>
    </form>
  </section>

  <section>
    <h2>Preview wheels on a car</h2>
    <form id="renderForm">
      <label>Car photo (optional) <input type="file" name="car_image" accept="image/jpeg,image/png,image/webp"></label>
      <input name="car_description" placeholder="Or describe the car, e.g. 2019 red VW Golf GTI hatchback">
      <label>Wheel photo (optional) <input type="file" name="wheel_image" accept="image/jpeg,image/png,image/webp"></label>
      <input name="wheel_description" placeholder="Or describe the wheels, e.g. 18in gloss black 5 double-spoke">
      <input name="stance_notes" placeholder="Stance notes (optional), e.g. lowered 30mm, flush fitment">
      <button id="renderBtn">Render</button>
    </form>
    <div id="result"></div>
  </section>
</main>

<script>
let sessionId = null;
const log = document.getElementById('log');

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

document.getElementById('chatForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('msg');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  add('user', text);
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    sessionId = data.session_id;
    add('bot', data.reply);
  } catch (err) {
    add('bot', 'Error: ' + err.message);
  }
});

document.getElementById('renderForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('renderBtn');
  const out = document.getElementById('result');
  btn.disabled = true;
  out.textContent = 'Rendering...';
  try {
    const r = await fetch('/api/render', { method: 'POST', body: new FormData(e.target) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Render failed');
    out.textContent = '';
    const img = document.createElement('img');
    img.src = 'data:image/png;base64,' + data.image_b64;
    out.appendChild(img);
  } catch (err) {
    out.textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
